{% if user.is_authenticated %}

    <div class="user-menu">

        <button class="btn user-name">
            {% if user.get_full_name %}
                {{ user.get_full_name }}
            {% else %}
                {{ user.username }}
            {% endif %}
        </button>

        <div class="menu-content">
            <a href="{% url 'account_reset_password' %}">
                Change Password
            </a>

            <a href="{% url 'accounts:logout' %}">
                Logout
            </a>
        </div>

    </div>

{% else %}

    <div class="auth-buttons">
        <a href="{% url 'accounts:login' %}" class="btn login-btn">
            Login
        </a>

        <a href="{% url 'accounts:register' %}" class="btn register-btn">
            Register
        </a>
    </div>

{% endif %}

<div id="packageModal" class="modal">

    <div class="modal-content">

        <span class="close-modal">&times;</span>

        <div class="popup-header">

            <div class="popup-image">

                <img id="popup-image" src="" alt="">

            </div>

            <div class="popup-details">

                <h1 id="popup-title"></h1>

                <div class="popup-info">

                    <span id="popup-stage"></span>

                    <span id="popup-subject"></span>

                    <span id="popup-class"></span>

                    <span id="popup-edition"></span>

                </div>

            </div>

        </div>

        <div class="popup-section">

            <h2>Περιγραφή</h2>

            <p id="popup-description"></p>

        </div>

        <div class="popup-section">

            <h2>Τι περιλαμβάνει</h2>

            <div id="popup-features">

            </div>

        </div>

        <div class="popup-section">

            <h2>Περιεχόμενα</h2>

            <div id="popup-chapters">

            </div>

        </div>

        <div class="popup-buttons">

            <div class="chapter-purchase">

                <div id="chapter-buy-selection" style="display: none;">
                    <select id="chapter-select">
                        <option value="">Επίλεξε κεφάλαιο</option>
                    </select>
                    <button id="chapter-payment-btn" style="display: none;">
                        Συνέχεια στην πληρωμή
                    </button>
                </div>
                
                <button id="buy-chapter-btn">
                    Αγορά Κεφαλαίου
                </button>

            </div>

            <button id="buy-book-btn">
                Αγορά Βιβλίου
            </button>

        </div>

    </div>

</div>

<section class="information-section">
    <div class="information-grid">
        {% for card, info in second_row %}
            <!-- ΚΑΡΤΑ (από το InformationPage) -->
            <div class="information-card" onclick="openInfoModal('{{ info.id }}')">
                <img src="{{ card.path_image }}" alt="{{ card.title }}">
                <div class="information-overlay">
                    <h3>{{ card.title }}</h3>
                </div>
            </div>

            <!-- POP-UP / MODAL (από το Informations) -->
            <div id="info-modal-{{ info.id }}" class="information-modal">
                <div class="information-modal-content">
                    <button type="button" class="information-close" onclick="closeInfoModal('{{ info.id }}')">&times;</button>
                    
                    {% if info.image %}
                        <img id="information-modal-image" src="{{ info.image }}" alt="{{ info.title }}">
                    {% endif %}

                    <div class="information-body">
                        <h2 id="information-modal-title">{{ info.title }}</h2>
                        <div id="information-modal-description">
                            {{ info.description|safe }}
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</section>

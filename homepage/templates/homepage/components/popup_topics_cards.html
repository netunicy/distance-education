<div id="trainingModal" class="modal">

    <div class="modal-content">

        <span class="close-modal">&times;</span>

        <div class="popup-header">

            <div class="popup-image">

                <img id="training-popup-image" src="" alt="">

            </div>

            <div class="popup-details">

                <h1 id="training-popup-title"></h1>

                <div class="popup-info">

                    <span id="training-popup-category"></span>

                    <span id="training-popup-level"></span>

                </div>

            </div>

        </div>

        <div class="popup-section">

            <h2>Περιγραφή</h2>

            <p id="training-popup-description"></p>

        </div>

        <div class="popup-section">

            <h2>Τι περιλαμβάνει</h2>

            <div id="training-popup-features"></div>

        </div>

        <div class="popup-section">

            <h2>Περιεχόμενα</h2>

            <div id="training-popup-contents"></div>

        </div>

        <div class="popup-buttons">

            <button id="buy-training-btn"
                    data-url="#">
                Αγορά Προγράμματος
            </button>

        </div>

    </div>

</div>

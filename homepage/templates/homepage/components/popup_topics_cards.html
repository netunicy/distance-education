<!-- ==========================================
     TOPICS MODAL
========================================== -->

<div id="topicsModal" class="modal">

    <div class="modal-content">

        <!-- CLOSE BUTTON -->

        <span class="close-modal">&times;</span>


        <!-- ==================================
             HEADER
        ================================== -->

        <div class="popup-header">

            <div class="popup-image">

                <img
                    id="topics-popup-image"
                    src=""
                    alt=""
                >

            </div>

            <div class="popup-details">

                <h1 id="topics-popup-title"></h1>

                <div class="popup-info">

                    <span id="topics-popup-category"></span>

                    <span id="topics-popup-level"></span>

                </div>

            </div>

        </div>


        <!-- ==================================
             DESCRIPTION
        ================================== -->

        <div class="popup-section">

            <h2>Περιγραφή</h2>

            <p id="topics-popup-description"></p>

        </div>


        <!-- ==================================
             FEATURES
        ================================== -->

        <div class="popup-section">

            <h2>Τι περιλαμβάνει</h2>

            <div id="topics-popup-features">

            </div>

        </div>


        <!-- ==================================
             CONTENTS
        ================================== -->

        <div
            id="topics-contents-section"
            class="popup-section"
        >

            <h2>Περιεχόμενα</h2>

            <div id="topics-popup-contents">
            </div>

        </div>


        <!-- ==================================
             PURCHASE / VIEW
        ================================== -->

        <div class="popup-buttons">

            <button
                id="buy-topics-btn"
                type="button"
            >
                Αγορά Προγράμματος
            </button>

        </div>

    </div>

</div>

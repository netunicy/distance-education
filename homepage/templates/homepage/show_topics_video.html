
{% extends "homepage/base.html" %}

{% block content %}

<h1>Topics Video</h1>

<hr>

<h2>Υλικό</h2>

<p>
    <strong>Τίτλος:</strong>
    {{ material.title }}
</p>

<p>
    <strong>Τύπος:</strong>
    {{ material.get_material_type_display }}
</p>

<p>
    <strong>Δωρεάν:</strong>
    {{ material.is_free }}
</p>

<hr>

<h2>Video</h2>

<video
    id="video"
    controls
    controlsList="nodownload"
    disablePictureInPicture
    disableRemotePlayback
    preload="metadata"
    width="900">
</video>


<!-- SHAKA PLAYER -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.15.12/shaka-player.compiled.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    // Έλεγχος φόρτωσης της βιβλιοθήκης
    if (typeof shaka === "undefined") {

        console.error(
            "Shaka Player library failed to load."
        );

        return;
    }

    shaka.polyfill.installAll();

    // Έλεγχος υποστήριξης του browser
    if (!shaka.Player.isBrowserSupported()) {

        console.error(
            "Ο browser δεν υποστηρίζει τον Shaka Player."
        );

        return;
    }

    // Εντοπισμός του video element
    const video = document.getElementById("video");

    if (!video) {

        console.error(
            "Video element not found."
        );

        return;
    }

    // Δημιουργία του player
    const player = new shaka.Player(video);

    // Καταγραφή σφαλμάτων
    player.addEventListener("error", function(event) {

        console.error(
            "Shaka Player Error:",
            event.detail
        );

    });

    // Φόρτωση προστατευμένου βίντεο
    try {

        const videoUrl = "{{ secure_video_url|escapejs }}";

        if (!videoUrl) {

            console.error(
                "Cloudflare Signed URL is missing."
            );

            return;
        }

        await player.load(videoUrl);

        console.log(
            "Video loaded successfully."
        );

    }

    catch(error) {

        console.error(
            "Video loading failed:",
            error
        );

    }

});

</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<style>

    /* ==========================================
       PAYMENT ERROR
    ========================================== */

    .payment-error-wrapper {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
        box-sizing: border-box;
    }

    .payment-error-card {
        width: 100%;
        max-width: 520px;
        background: #ffffff;
        border: 1px solid #e8e8e8;
        border-radius: 18px;
        padding: 2.5rem;
        text-align: center;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        box-sizing: border-box;
    }

    .payment-error-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 1.5rem;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        background: #fff2f2;
        color: #c62828;

        font-size: 2rem;
        font-weight: 700;
    }

    .payment-error-card h1 {
        margin: 0 0 1rem;
        font-size: 1.8rem;
        color: #222222;
    }

    .payment-error-card p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.7;
        color: #666666;
    }

    .payment-error-message {
        margin-top: 1.5rem;
        padding: 1rem 1.2rem;

        background: #fff7f7;
        border: 1px solid #f1cccc;
        border-radius: 10px;

        color: #a52828;
        font-size: 0.95rem;
    }

    .payment-error-actions {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
    }

    .payment-back-btn {
        display: inline-block;

        padding: 14px 24px;

        background: #2b7cff;
        color: #ffffff;

        border: none;
        border-radius: 10px;

        font-family: inherit;
        font-size: 16px;
        font-weight: 600;

        text-decoration: none;
        cursor: pointer;

        transition: .25s;
    }

    .payment-back-btn:hover {
        background: #1f63d1;
        color: #ffffff;
        text-decoration: none;
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media only screen and (max-width: 600px) {

        .payment-error-wrapper {
            padding: 1rem;
        }

        .payment-error-card {
            padding: 2rem 1.2rem;
        }

        .payment-error-card h1 {
            font-size: 1.5rem;
        }

        .payment-error-icon {
            width: 60px;
            height: 60px;
            font-size: 1.7rem;
        }

        .payment-back-btn {
            width: 100%;
            box-sizing: border-box;
        }

    }

</style>


<div class="payment-error-wrapper">

    <div class="payment-error-card">

        <div class="payment-error-icon">
            ×
        </div>

        <h1>
            Η πληρωμή δεν ολοκληρώθηκε
        </h1>

        <p>
            Παρουσιάστηκε πρόβλημα κατά την επεξεργασία
            ή την επιβεβαίωση της πληρωμής σας.
        </p>

        {% if error_message %}

            <div class="payment-error-message">
                {{ error_message }}
            </div>

        {% endif %}

        <div class="payment-error-actions">

            <a href="/" class="payment-back-btn">
                Επιστροφή στην αρχική
            </a>

        </div>

    </div>

</div>

{% endblock %}
